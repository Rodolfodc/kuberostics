name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    name: colcon build + test (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # a failure on one distro must not hide the other (Art. X)
      matrix:
        distro: [jazzy, lyrical]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Build the ${{ matrix.distro }} image
        run: docker build -t vacuum-ci:${{ matrix.distro }} docker/${{ matrix.distro }}
      # Same logic as local runs: rosdep install, colcon build, colcon test; no CoppeliaSim.
      - name: Build and test
        run: ROS_IMAGE=vacuum-ci:${{ matrix.distro }} TEST_OUT="$RUNNER_TEMP/test-out" scripts/test-docker.sh ${{ matrix.distro }}
      # JUnit XML, colcon test logs and the failing-test dump, to diagnose intermittent failures.
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.distro }}
          path: ${{ runner.temp }}/test-out
          if-no-files-found: warn
