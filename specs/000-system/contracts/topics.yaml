# System interface contract (single source of truth).
# Read by the contract tests (vacuum_contract_tests package).
#
# Fields:
#   owner: who publishes (the server, for services and actions)
#   frozen: true = inherited from IA368II, cannot change (Constitution, Art. II)
#   qos: reliability / durability / depth
#   since: spec that introduces the interface
#
# IA368II QoS: QoSProfile(depth=1) => reliable, volatile, keep_last 1.

qos_profiles:
  ia368ii: {reliability: reliable, durability: volatile, depth: 1}
  sensor:  {reliability: best_effort, durability: volatile, depth: 5}
  latched: {reliability: reliable, durability: transient_local, depth: 1}
  default: {reliability: reliable, durability: volatile, depth: 10}

topics:
  # ---- inherited from the orchestrator (frozen) ----
  - name: /myRobot/behaviour/mode
    type: std_msgs/msg/String
    qos: ia368ii
    owner: behaviour_server
    frozen: true
    note: "CLEANING | AUTODOCKING | CHARGING | CHARGED | IDLE; republished every 0.2 s"
  - name: /myRobot/battery_state
    type: sensor_msgs/msg/BatteryState
    qos: ia368ii
    owner: myrobot
    frozen: true
  - name: /myRobot/charging_base/strengthSignal
    type: std_msgs/msg/Float32
    qos: ia368ii
    owner: myrobot
    frozen: true
  - name: /myRobot/charging_base/relativeAngle
    type: std_msgs/msg/Float32
    qos: ia368ii
    owner: myrobot
    frozen: true
  - name: /myRobot/cmd_vel
    type: geometry_msgs/msg/Twist
    qos: ia368ii
    owner: twist_mux          # sole publisher (D-03)
    frozen: true
    max_publishers: 1

  # ---- inherited from the 2025S2 project (reuse) ----
  - {name: /scan,         type: sensor_msgs/msg/LaserScan, qos: default, owner: my_robot_scan_node,   frozen: true}
  - {name: /camera,       type: sensor_msgs/msg/Image,     qos: default, owner: my_robot_vision_node, frozen: true}
  - {name: /camera_depth, type: sensor_msgs/msg/Image,     qos: default, owner: my_robot_vision_node, frozen: true}

  # ---- new (spec 001) ----
  - name: /myRobot/behaviour/submode
    type: vacuum_interfaces/msg/Submode
    qos: ia368ii
    owner: supervisor
    since: "001"
    note: "republished every 0.2 s, like the mode"
  - name: /myRobot/stuck
    type: vacuum_interfaces/msg/StuckEvent
    qos: default
    owner: stuck_detector
    since: "001"
  - name: /myRobot/notifications
    type: vacuum_interfaces/msg/Notification
    qos: default
    owner: "*"                # any node may notify
    since: "001"
  - name: /myRobot/mux/lock_stop
    type: std_msgs/msg/Bool
    qos: ia368ii
    owner: supervisor
    since: "001"

  - name: /myRobot/telemetry/supervisor
    type: diagnostic_msgs/msg/DiagnosticArray
    qos: default
    owner: supervisor
    since: "001"
    note: "D-20: state and counters (transitions, stuck events, escapes) at 1 Hz"

  - name: /myRobot/telemetry/stop_guard
    type: diagnostic_msgs/msg/DiagnosticArray
    qos: default
    owner: stop_guard
    since: "001"
    note: "D-20: lock state and counters at 1 Hz"

  - name: /myRobot/telemetry/coverage_server
    type: diagnostic_msgs/msg/DiagnosticArray
    qos: default
    owner: coverage_server
    since: "001"
    note: "D-20: stub state and counters at 1 Hz"

  - name: /myRobot/telemetry/escape_server
    type: diagnostic_msgs/msg/DiagnosticArray
    qos: default
    owner: escape_server
    since: "001"
    note: "D-20: stub state and counters at 1 Hz"

  - name: /myRobot/telemetry/stuck_detector
    type: diagnostic_msgs/msg/DiagnosticArray
    qos: default
    owner: stuck_detector
    since: "001"
    note: "D-20: stub state and counters at 1 Hz"

  # twist_mux inputs (higher priority wins)
  - {name: /myRobot/mux/teleop,   type: geometry_msgs/msg/Twist, qos: ia368ii, owner: teleop,             priority: 100, since: "001"}
  - {name: /myRobot/mux/stop,     type: geometry_msgs/msg/Twist, qos: ia368ii, owner: stop_guard,         priority: 250, since: "001", note: "D-22: zero velocity, published only while lock_stop is true"}
  - {name: /myRobot/mux/escape,   type: geometry_msgs/msg/Twist, qos: ia368ii, owner: escape_server,      priority: 80,  since: "001"}
  - {name: /myRobot/mux/nav,      type: geometry_msgs/msg/Twist, qos: ia368ii, owner: controller_server,  priority: 60,  since: "005"}
  - {name: /myRobot/mux/coverage, type: geometry_msgs/msg/Twist, qos: ia368ii, owner: coverage_server,    priority: 50,  since: "001"}
  - {name: /myRobot/mux/docking,  type: geometry_msgs/msg/Twist, qos: ia368ii, owner: autodocking_server, priority: 40,  since: "001"}
  - {name: /myRobot/legacy/cleaning_cmd_vel, type: geometry_msgs/msg/Twist, qos: ia368ii, owner: cleaning_server, sink: true, since: "001", note: "D-04: nobody subscribes"}

  # ---- detector offloading (spec 009a) ----
  - {name: /myRobot/perception/rgb_throttled/compressed, type: sensor_msgs/msg/CompressedImage, qos: sensor, owner: image_throttle, since: "009a", note: "RGB only, compressed, 2 Hz; depth never leaves the robot"}
  - {name: /myRobot/perception/detections/cloud, type: vision_msgs/msg/Detection2DArray, qos: default, owner: detector_cloud, since: "009a", note: "header = image header (timestamp echo); publishes an empty array when nothing is detected"}
  - {name: /myRobot/perception/detections/local, type: vision_msgs/msg/Detection2DArray, qos: default, owner: detector_local, since: "009a"}
  - {name: /myRobot/perception/detections, type: vision_msgs/msg/Detection2DArray, qos: default, owner: detection_selector, max_publishers: 1, since: "009a"}
  - {name: /myRobot/perception/offload_status, type: vacuum_interfaces/msg/OffloadStatus, qos: ia368ii, owner: detection_selector, since: "009a"}
  - {name: /detections_markers, type: visualization_msgs/msg/MarkerArray, qos: default, owner: projector, frozen: true, since: "009a", note: "format consumed by the 2025S2 semantic node"}

services:
  - name: /myRobot/start_stop
    type: myrobot_interfaces/srv/StartStop
    owner: behaviour_server
    frozen: true

  - name: /myRobot/supervisor/reset
    type: std_srvs/srv/Trigger
    owner: supervisor
    since: "001"
    note: "releases the stop lock after ESCAPE_FAILED, whatever the current submode (001-R22)"

  - name: /myRobot/stuck_detector/trigger
    type: std_srvs/srv/Trigger
    owner: stuck_detector
    since: "001"
    note: "stub (T012): publishes one StuckEvent per call; real detection is spec 005"

actions:
  - name: /myRobot/escape
    type: vacuum_interfaces/action/Escape
    owner: escape_server
    since: "001"
  - name: /myRobot/cover_room
    type: vacuum_interfaces/action/CoverRoom
    owner: coverage_server
    since: "001"

lifecycle:
  ia368ii_manager: [myrobot, behaviour_server, cleaning_server, autodocking_server, charging_server, charged_server]
  lifecycle_manager_core: [supervisor, stop_guard, stuck_detector, escape_server, coverage_server]
  lifecycle_manager_optional: []      # MQTT bridge enters in spec 009

# Public parameters (Art. I.1). Values are the defaults; the launch file may override them.
parameters:
  supervisor:
    escape_timeout_s: {type: double, default: 20.0, requirement: 001-R09}
    escape_server_wait_s: {type: double, default: 2.0, requirement: 001-R09, note: "bounded wait for an undiscovered escape server before the stuck event counts as a failed escape; the escape_timeout_s clock is not extended"}
    publish_rate_hz: {type: double, default: 5.0, note: "submode and lock_stop republication"}
    telemetry_rate_hz: {type: double, default: 1.0}
    mode_topic: {type: string, default: /myRobot/behaviour/mode}
    cover_room_action: {type: string, default: /myRobot/cover_room}
    escape_action: {type: string, default: /myRobot/escape}
  stop_guard:
    publish_rate_hz: {type: double, default: 10.0, note: "must stay above 1 / timeout of the mux stop input (0.5 s)"}
    telemetry_rate_hz: {type: double, default: 1.0}
  coverage_server:
    telemetry_rate_hz: {type: double, default: 1.0}
    linear_x: {type: double, default: 0.15, note: "constant forward speed while a CoverRoom goal is active (stub, T010)"}
    angular_z: {type: double, default: 0.0}
    publish_rate_hz: {type: double, default: 10.0}
  escape_server:
    telemetry_rate_hz: {type: double, default: 1.0}
    outcome: {type: string, default: succeed, values: [succeed, fail, hang], requirement: 001-R16}
    reverse_s: {type: double, default: 1.0, note: "stub script: reverse for reverse_s, then turn for turn_s (T011)"}
    turn_s: {type: double, default: 1.0}
    reverse_linear_x: {type: double, default: -0.1}
    turn_angular_z: {type: double, default: 0.8}
    publish_rate_hz: {type: double, default: 10.0}
  stuck_detector:
    telemetry_rate_hz: {type: double, default: 1.0}
