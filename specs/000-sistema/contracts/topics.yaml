# Contrato de interfaces do sistema (fonte única de verdade).
# Lido pelos testes de contrato (pacote aspirador_contract_tests).
#
# Campos:
#   owner: quem publica (servidor, no caso de serviço e ação)
#   frozen: true = herdado do Luciano, não pode mudar (Constituição, Art. II)
#   qos: reliability / durability / depth
#   since: spec que introduz a interface
#
# QoS do Luciano: QoSProfile(depth=1) => reliable, volatile, keep_last 1.

qos_profiles:
  luciano: {reliability: reliable, durability: volatile, depth: 1}
  sensor:  {reliability: best_effort, durability: volatile, depth: 5}
  latched: {reliability: reliable, durability: transient_local, depth: 1}
  default: {reliability: reliable, durability: volatile, depth: 10}

topics:
  # ---- herdados do orquestrador (congelados) ----
  - name: /myRobot/behaviour/mode
    type: std_msgs/msg/String
    qos: luciano
    owner: behaviour_server
    frozen: true
    note: "CLEANING | AUTODOCKING | CHARGING | CHARGED | IDLE; republicado a cada 0,2 s"
  - name: /myRobot/battery_state
    type: sensor_msgs/msg/BatteryState
    qos: luciano
    owner: myrobot
    frozen: true
  - name: /myRobot/charging_base/strengthSignal
    type: std_msgs/msg/Float32
    qos: luciano
    owner: myrobot
    frozen: true
  - name: /myRobot/charging_base/relativeAngle
    type: std_msgs/msg/Float32
    qos: luciano
    owner: myrobot
    frozen: true
  - name: /myRobot/cmd_vel
    type: geometry_msgs/msg/Twist
    qos: luciano
    owner: twist_mux          # único publicador (D-03)
    frozen: true
    max_publishers: 1

  # ---- herdados do projeto 2025S2 (reuso) ----
  - {name: /scan,         type: sensor_msgs/msg/LaserScan, qos: default, owner: my_robot_scan_node,   frozen: true}
  - {name: /camera,       type: sensor_msgs/msg/Image,     qos: default, owner: my_robot_vision_node, frozen: true}
  - {name: /camera_depth, type: sensor_msgs/msg/Image,     qos: default, owner: my_robot_vision_node, frozen: true}

  # ---- novos (spec 001) ----
  - name: /myRobot/behaviour/submode
    type: aspirador_interfaces/msg/Submode
    qos: luciano
    owner: supervisor
    since: "001"
    note: "republicado a cada 0,2 s, como o modo"
  - name: /myRobot/stuck
    type: aspirador_interfaces/msg/StuckEvent
    qos: default
    owner: stuck_detector
    since: "001"
  - name: /myRobot/notifications
    type: aspirador_interfaces/msg/Notification
    qos: default
    owner: "*"                # qualquer nó pode notificar
    since: "001"
  - name: /myRobot/mux/lock_stop
    type: std_msgs/msg/Bool
    qos: luciano
    owner: supervisor
    since: "001"

  # entradas do twist_mux (prioridade maior vence)
  - {name: /myRobot/mux/teleop,   type: geometry_msgs/msg/Twist, qos: luciano, owner: teleop,             priority: 100, since: "001"}
  - {name: /myRobot/mux/escape,   type: geometry_msgs/msg/Twist, qos: luciano, owner: escape_server,      priority: 80,  since: "001"}
  - {name: /myRobot/mux/nav,      type: geometry_msgs/msg/Twist, qos: luciano, owner: controller_server,  priority: 60,  since: "005"}
  - {name: /myRobot/mux/coverage, type: geometry_msgs/msg/Twist, qos: luciano, owner: coverage_server,    priority: 50,  since: "001"}
  - {name: /myRobot/mux/docking,  type: geometry_msgs/msg/Twist, qos: luciano, owner: autodocking_server, priority: 40,  since: "001"}
  - {name: /myRobot/legacy/cleaning_cmd_vel, type: geometry_msgs/msg/Twist, qos: luciano, owner: cleaning_server, sink: true, since: "001", note: "D-04: ninguém assina"}

services:
  - name: /myRobot/start_stop
    type: myrobot_interfaces/srv/StartStop
    owner: behaviour_server
    frozen: true

actions:
  - name: /myRobot/escape
    type: aspirador_interfaces/action/Escape
    owner: escape_server
    since: "001"
  - name: /myRobot/cover_room
    type: aspirador_interfaces/action/CoverRoom
    owner: coverage_server
    since: "001"

lifecycle:
  luciano_manager: [myrobot, behaviour_server, cleaning_server, autodocking_server, charging_server, charged_server]
  lifecycle_manager_core: [supervisor, stuck_detector, escape_server, coverage_server]
  lifecycle_manager_optional: []      # ponte MQTT entra na spec 009
