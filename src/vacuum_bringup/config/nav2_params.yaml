# Nav2 configuration of spec 005 (planner_server, controller_server, bt_navigator). Configuration only (Art. II).
# One file for both distributions: Nav2 ignores parameters it does not declare, so the entries that differ
# between Jazzy (Nav2 1.3.x) and Lyrical (Nav2 1.5.x) are listed side by side and marked. docs of the differences:
# the header of launch/nav.launch.py.
#
# Robot facts (src/vacuum_sim_bridge/README.md, profile.py): the model frame has forward = local +Y; the ROS frame
# base_link is the model frame rotated +90 deg about z, so forward = +x of base_link and nothing here needs a
# yaw offset. Footprint: circle of radius 0.18 m about the model origin (= base_link origin). Limits: 0.5 m/s and
# 90 deg/s (the wheel bridge caps there); we ask for far less (desired_linear_vel 0.25 m/s, spec 009a caps at 0.30).
# Frames: map -> my_robot_odom (SLAM or static) -> base_footprint -> base_link -> laser_link.
# use_sim_time stays false everywhere (the bridges stamp with wall time and publish no /clock).

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /myrobot/odom                    # nav_msgs/Odometry (Q-14)
    transform_tolerance: 0.5
    bt_loop_duration: 20
    default_server_timeout: 20
    wait_for_service_timeout: 1000
    navigators: ["navigate_to_pose"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    # nav_bt.xml is substituted into this parameter by nav.launch.py (absolute path of the installed file).
    default_nav_to_pose_bt_xml: "nav_bt.xml"
    # Jazzy (1.3.x) name:
    error_code_names: ["compute_path_error_code", "follow_path_error_code"]
    # Lyrical (1.5.x) name:
    error_code_name_prefixes: ["compute_path", "follow_path", "nav_to_pose"]

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    odom_topic: /myrobot/odom
    costmap_update_timeout: 1.0     # the simulator runs a few steps/s: the default 0.30 s would abort the goal
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]
    use_realtime_priority: false
    # D-13: Nav2 1.5.x publishes a TwistStamped on cmd_vel unless this is false; 1.3.x ignores the name.
    # Everything on /myRobot/mux/* is an unstamped Twist.
    enable_stamped_cmd_vel: false
    # Lyrical only (declared there, ignored on Jazzy):
    path_handler_plugins: ["PathHandler"]
    PathHandler:
      plugin: "nav2_controller::SimplePathHandler"
    speed_limit_topic: "speed_limit"

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.3
      movement_time_allowance: 15.0
    general_goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.5
    FollowPath:
      plugin: "nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController"
      desired_linear_vel: 0.25
      lookahead_dist: 0.5
      min_lookahead_dist: 0.3
      max_lookahead_dist: 0.9
      lookahead_time: 1.5
      transform_tolerance: 0.5
      use_velocity_scaled_lookahead_dist: false
      min_approach_linear_velocity: 0.05
      approach_velocity_scaling_dist: 0.6
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 1.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.5
      regulated_linear_scaling_min_speed: 0.1
      use_rotate_to_heading: true
      rotate_to_heading_min_angle: 0.785
      rotate_to_heading_angular_vel: 1.0       # rad/s, below the 90 deg/s (1.57 rad/s) bridge cap
      max_angular_accel: 3.2
      allow_reversing: false
      # Lyrical (1.5.x) renamed/added some of these; the old names are kept for Jazzy:
      max_robot_pose_search_dist: 10.0
      interpolate_curvature_after_goal: false

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 1.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: true
      allow_unknown: false

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: my_robot_odom
      robot_base_frame: base_link
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      robot_radius: 0.18
      transform_tolerance: 0.5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser_link
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.0
          raytrace_max_range: 5.0
          raytrace_min_range: 0.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 1.0
      global_frame: map
      robot_base_frame: base_link
      robot_radius: 0.18
      resolution: 0.05
      transform_tolerance: 0.5
      track_unknown_space: true
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          sensor_frame: laser_link
          data_type: "LaserScan"
          marking: true
          clearing: true
          max_obstacle_height: 2.0
          obstacle_max_range: 4.0
          raytrace_max_range: 5.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.35
      always_send_full_costmap: true
