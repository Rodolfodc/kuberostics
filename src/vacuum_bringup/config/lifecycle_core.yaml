# lifecycle_manager_core (T013, spec 001): manages OUR core nodes; the IA368II nodes have their own manager
# (config/lifecycle_manager.yaml of myrobot_bringup). Cloud/MQTT nodes will get lifecycle_manager_optional (D-09).
#
# Order matters: stop_guard first (the safety net is up before anything can move), the actuators next, the
# supervisor last (it sends goals to the servers as soon as it is active).
lifecycle_manager_core:
  ros__parameters:
    autostart: true
    # Our nodes do not create bonds; the Nav2 default (4.0 s) would make the manager wait for them.
    bond_timeout: 0.0
    # The Nav2 default (5 s) is how long the manager waits for a node's lifecycle service to appear. Our nodes
    # are Python processes that start at the same time as the manager; on a loaded 1-CPU runner (Lyrical,
    # Python 3.14) one is not up after 5 s, the manager then gives up on the whole bring-up and nothing is
    # configured (supervisor never subscribes). Set explicitly, Art. X / D-13 style.
    service_timeout: 60.0
    node_names:
      - stop_guard
      - coverage_server
      - escape_server
      - stuck_detector
      - supervisor
