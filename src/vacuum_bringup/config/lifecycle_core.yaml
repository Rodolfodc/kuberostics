# lifecycle_manager_core (T013, spec 001): manages OUR core nodes; the IA368II nodes have their own manager
# (config/lifecycle_manager.yaml of myrobot_bringup). Cloud/MQTT nodes will get lifecycle_manager_optional (D-09).
#
# Order matters: stop_guard first (the safety net is up before anything can move), the actuators next, the
# supervisor last (it sends goals to the servers as soon as it is active).
lifecycle_manager_core:
  ros__parameters:
    autostart: true
    # Our nodes do not create bonds; the Nav2 default (4.0 s) would make the manager wait for them.
    bond_timeout: 0.0
    node_names:
      - stop_guard
      - coverage_server
      - escape_server
      - stuck_detector
      - supervisor
