# T902: cloud side of the transport measurement. Namespace t902 only; both deployments start at 0 replicas
# and scripts/transport-bench.sh scales exactly one up at a time.
# Image t902-bench:<distro> is loaded with `k3d image import`, never pulled (imagePullPolicy: Never).
apiVersion: v1
kind: Namespace
metadata:
  name: t902
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: bridge-cloud
  namespace: t902
data:
  bridge.json5: |
    // Cloud side: only the detections go out, only the compressed RGB comes in (009a-R03).
    {
      plugins: { ros2dds: { allow: {
        publishers:  ["/myRobot/perception/detections/cloud"],
        subscribers: ["/myRobot/perception/rgb_throttled/compressed"],
      } } },
    }
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cloud-rmw, namespace: t902}
spec:
  replicas: 0
  selector: {matchLabels: {app: cloud-rmw}}
  template:
    metadata: {labels: {app: cloud-rmw}}
    spec:
      containers:
        - name: echo
          image: t902-bench:lyrical
          imagePullPolicy: Never
          args: ["rmw", "echo"]
          ports: [{containerPort: 7447}]
          securityContext: {allowPrivilegeEscalation: false}
---
apiVersion: v1
kind: Service
metadata: {name: cloud-rmw, namespace: t902}
spec:
  type: NodePort
  selector: {app: cloud-rmw}
  ports: [{port: 7447, targetPort: 7447, nodePort: 30447}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: cloud-bridge, namespace: t902}
spec:
  replicas: 0
  selector: {matchLabels: {app: cloud-bridge}}
  template:
    metadata: {labels: {app: cloud-bridge}}
    spec:
      containers:
        - name: echo
          image: t902-bench:lyrical
          imagePullPolicy: Never
          args: ["dds", "echo"]
          securityContext: {allowPrivilegeEscalation: false}
        - name: bridge   # shares the pod network namespace with the DDS node
          image: eclipse/zenoh-bridge-ros2dds:1.10.2
          imagePullPolicy: IfNotPresent
          env: [{name: ROS_AUTOMATIC_DISCOVERY_RANGE, value: LOCALHOST}, {name: ROS_DISTRO, value: lyrical}]
          args: ["-l", "tcp/0.0.0.0:7447", "--no-multicast-scouting", "-c", "/cfg/bridge.json5"]
          ports: [{containerPort: 7447}]
          volumeMounts: [{name: cfg, mountPath: /cfg}]
          securityContext: {allowPrivilegeEscalation: false}
      volumes:
        - name: cfg
          configMap: {name: bridge-cloud}
---
apiVersion: v1
kind: Service
metadata: {name: cloud-bridge, namespace: t902}
spec:
  type: NodePort
  selector: {app: cloud-bridge}
  ports: [{port: 7447, targetPort: 7447, nodePort: 30448}]
